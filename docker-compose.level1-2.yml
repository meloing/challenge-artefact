version: "3.8"

networks:
  waba-net:
    driver: bridge

volumes:
  minio-data:
  airflow-db-data:

services:
  # ---------------------------------------------------------------------------
  # 1. Object Storage: MinIO (S3 Compatible Lakehouse Storage)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: waba-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - waba-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Bucket Auto-Provisioning Helper
  minio-init:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: waba-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - waba-net
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123};
      /usr/bin/mc mb --ignore-existing myminio/raw-landing;
      /usr/bin/mc mb --ignore-existing myminio/lakehouse;
      /usr/bin/mc mb --ignore-existing myminio/archive;
      echo 'MinIO Lakehouse buckets provisioned.';
      exit 0;
      "

  # ---------------------------------------------------------------------------
  # 2. Apache Iceberg REST Catalog
  # ---------------------------------------------------------------------------
  iceberg-rest:
    image: tabulario/iceberg-rest:1.5.0
    container_name: waba-iceberg-rest
    restart: always
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "8181:8181"
    environment:
      - CATALOG_WAREHOUSE=s3a://lakehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3__ENDPOINT=http://minio:9000
      - CATALOG_S3__PATH_STYLE_ACCESS=true
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
    networks:
      - waba-net

  # ---------------------------------------------------------------------------
  # 3. Streamlit Data Generation Application (Level 1)
  # ---------------------------------------------------------------------------
  streamlit-generator:
    build:
      context: .
      dockerfile: Dockerfile.generator
    container_name: waba-streamlit-app
    restart: always
    depends_on:
      - minio-init
    ports:
      - "8501:8501"
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - ./data_generator:/app/data_generator
    networks:
      - waba-net

  # ---------------------------------------------------------------------------
  # 4. Trino Distributed SQL Query Engine (Level 1 & 2)
  # ---------------------------------------------------------------------------
  trino:
    image: trinodb/trino:448
    container_name: waba-trino
    restart: always
    depends_on:
      - iceberg-rest
    ports:
      - "8080:8080"
    volumes:
      - ./trino/etc/catalog:/etc/trino/catalog
    networks:
      - waba-net

  # ---------------------------------------------------------------------------
  # 5. Apache Spark Batch Master & Worker (Level 1 & 2)
  # ---------------------------------------------------------------------------
  spark-master:
    image: apache/spark:3.5.1
    container_name: waba-spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
    ports:
      - "7077:7077"
      - "8081:8081"
    volumes:
      - .:/opt/spark/work-dir
    networks:
      - waba-net

  spark-worker:
    image: apache/spark:3.5.1
    container_name: waba-spark-worker
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    volumes:
      - .:/opt/spark/work-dir
    networks:
      - waba-net

  # ---------------------------------------------------------------------------
  # 6. Apache Airflow Orchestrator (Level 2)
  # ---------------------------------------------------------------------------
  airflow-postgres:
    image: postgres:15-alpine
    container_name: waba-airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow_secure_password
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    networks:
      - waba-net

  airflow-webserver:
    image: apache/airflow:2.9.1-python3.11
    container_name: waba-airflow-webserver
    restart: always
    depends_on:
      - airflow-postgres
      - minio-init
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow_secure_password@airflow-postgres/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - MINIO_ENDPOINT=http://minio:9000
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "8085:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./lakehouse:/opt/airflow/lakehouse
    networks:
      - waba-net
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create --username admin --firstname Armel --lastname Kouadio --role Admin --email admin@waba.group --password admin &&
      airflow webserver"

  airflow-scheduler:
    image: apache/airflow:2.9.1-python3.11
    container_name: waba-airflow-scheduler
    restart: always
    depends_on:
      - airflow-webserver
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow_secure_password@airflow-postgres/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - MINIO_ENDPOINT=http://minio:9000
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./lakehouse:/opt/airflow/lakehouse
    networks:
      - waba-net
    command: airflow scheduler
