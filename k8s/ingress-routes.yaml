apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: waba-platform-ingress
  namespace: serving
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "256m"
spec:
  rules:
    - host: superset.waba.group
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: superset-service
                port:
                  number: 8088
    - host: airflow.waba.group
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: airflow-service
                port:
                  number: 8080
    - host: nifi.waba.group
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nifi-service
                port:
                  number: 8080
    - host: grafana.waba.group
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana-service
                port:
                  number: 3000
    - host: trino.waba.group
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trino-service
                port:
                  number: 8080
