apiVersion: apps/v1
kind: Deployment
metadata:
  name: nifi
  namespace: ingestion
  labels:
    app: nifi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nifi
  template:
    metadata:
      labels:
        app: nifi
    spec:
      containers:
        - name: nifi
          image: apache/nifi:1.25.0
          env:
            - name: NIFI_WEB_HTTP_PORT
              value: "8080"
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /nifi
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /nifi
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: nifi-service
  namespace: ingestion
spec:
  type: ClusterIP
  selector:
    app: nifi
  ports:
    - port: 8080
      targetPort: 8080
      name: http
