# Global Configuration & Secret Management
# Secrets are managed as K8s Secret references (never hardcoded in plain text)
apiVersion: v1
kind: ConfigMap
metadata:
  name: waba-platform-config
  namespace: processing
data:
  MINIO_ENDPOINT: "http://minio-service.ingestion.svc.cluster.local:9000"
  ICEBERG_REST_URI: "http://iceberg-rest.serving.svc.cluster.local:8181"
  ICEBERG_WAREHOUSE: "s3a://lakehouse/"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service.ingestion.svc.cluster.local:9092"
  BCEAO_MAX_NPL_RATIO: "0.05"
  CIMA_MAX_LOSS_RATIO: "0.70"
---
apiVersion: v1
kind: Secret
metadata:
  name: waba-credentials
  namespace: processing
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "waba_minio_k8s_admin"
  AWS_SECRET_ACCESS_KEY: "waba_minio_k8s_super_secure_vault_pass"
  AIRFLOW_DATABASE_PASSWORD: "airflow_db_production_secret"
  KEYCLOAK_ADMIN_PASSWORD: "keycloak_admin_master_secret"
---
apiVersion: v1
kind: Secret
metadata:
  name: waba-credentials
  namespace: ingestion
type: Opaque
stringData:
  MINIO_ROOT_USER: "waba_minio_k8s_admin"
  MINIO_ROOT_PASSWORD: "waba_minio_k8s_super_secure_vault_pass"
---
apiVersion: v1
kind: Secret
metadata:
  name: waba-credentials
  namespace: serving
type: Opaque
stringData:
  TRINO_SHARED_SECRET: "trino_internal_cluster_jwt_token"
