apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: waba-spark-bronze-batch
  namespace: processing
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: "apache/spark-py:v3.5.1"
  imagePullPolicy: IfNotPresent
  mainApplicationFile: "local:///opt/spark/work-dir/lakehouse/spark_jobs/bronze_ingestion.py"
  sparkVersion: "3.5.1"
  restartPolicy:
    type: OnFailure
    onFailureRetries: 3
    onFailureRetryInterval: 10
    onSubmissionFailureRetries: 3
  driver:
    cores: 1
    coreLimit: "1200m"
    memory: "2048m"
    labels:
      version: 3.5.1
    serviceAccount: spark-operator-spark
  executor:
    cores: 2
    instances: 3
    memory: "4096m"
    labels:
      version: 3.5.1
  deps:
    packages:
      - "org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.5.2"
      - "org.apache.hadoop:hadoop-aws:3.3.4"
---
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: waba-spark-streaming-fraud-aml
  namespace: processing
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: "apache/spark-py:v3.5.1"
  imagePullPolicy: IfNotPresent
  mainApplicationFile: "local:///opt/spark/work-dir/streaming/silver_to_gold_streaming.py"
  sparkVersion: "3.5.1"
  restartPolicy:
    type: Always
  driver:
    cores: 1
    memory: "2048m"
    serviceAccount: spark-operator-spark
  executor:
    cores: 2
    instances: 2
    memory: "3072m"
  deps:
    packages:
      - "org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1"
      - "org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.5.2"
