apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset
  namespace: serving
  labels:
    app: superset
spec:
  replicas: 1
  selector:
    matchLabels:
      app: superset
  template:
    metadata:
      labels:
        app: superset
    spec:
      containers:
        - name: superset
          image: apache/superset:3.1.2
          ports:
            - containerPort: 8088
              name: http
          livenessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 40
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: superset-service
  namespace: serving
spec:
  type: ClusterIP
  selector:
    app: superset
  ports:
    - port: 8088
      targetPort: 8088
      name: http
