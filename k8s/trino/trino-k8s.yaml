apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino-coordinator
  namespace: serving
  labels:
    app: trino-coordinator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trino-coordinator
  template:
    metadata:
      labels:
        app: trino-coordinator
    spec:
      containers:
        - name: trino
          image: trinodb/trino:448
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /v1/info
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /v1/info/state
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: trino-service
  namespace: serving
spec:
  type: ClusterIP
  selector:
    app: trino-coordinator
  ports:
    - port: 8080
      targetPort: 8080
      name: http
