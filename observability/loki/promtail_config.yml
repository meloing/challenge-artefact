server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: waba_application_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: waba_services
          __path__: /var/log/waba/*.log
    pipeline_stages:
      # Parse JSON log payloads for Spark and Airflow
      - json:
          expressions:
            timestamp: time
            level: level
            logger: logger
            message: message
            country_code: country_code
            entity_type: entity_type
      - labels:
          level:
          country_code:
          entity_type:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
