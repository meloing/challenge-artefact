global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  # 1. Apache Kafka Exporter
  - job_name: "kafka"
    static_configs:
      - targets: ["kafka-exporter:9308"]
    metrics_path: /metrics

  # 2. Apache NiFi Metrics
  - job_name: "nifi"
    static_configs:
      - targets: ["nifi:9090"]
    metrics_path: /nifi-api/controller/cluster

  # 3. Apache Airflow Exporter
  - job_name: "airflow"
    static_configs:
      - targets: ["airflow-webserver:8793"]
    metrics_path: /metrics

  # 4. Trino Query Engine
  - job_name: "trino"
    static_configs:
      - targets: ["trino:8080"]
    metrics_path: /v1/info

  # 5. Apache Spark Metrics (Spark PrometheusServlet)
  - job_name: "spark_streaming"
    static_configs:
      - targets: ["spark-master:4040", "spark-worker-1:4040"]
    metrics_path: /metrics/prometheus
